name: sistema-estoque
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup primeiro}
      POSTGRES_DB: estoque
    ports: ['127.0.0.1:5433:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estoque -d estoque']
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  postgres-data:
